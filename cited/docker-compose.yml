services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cited
      POSTGRES_PASSWORD: cited
      POSTGRES_DB: cited
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cited -d cited"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
