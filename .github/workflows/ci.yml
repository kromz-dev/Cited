name: CI

on:
  pull_request:
    paths:
      - "cited/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "cited/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cited

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cited
          POSTGRES_PASSWORD: cited
          POSTGRES_DB: cited
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cited -d cited"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cited:cited@localhost:5432/cited
      AUTH_SECRET: ci-placeholder-secret-value-32-chars
      AUTH_GOOGLE_ID: ci
      AUTH_GOOGLE_SECRET: ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INNGEST_SIGNING_KEY: ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      STRIPE_PRICE_SOLO: price_ci
      STRIPE_PRICE_PRO: price_ci
      STRIPE_PRICE_SCALE: price_ci
      RESEND_API_KEY: ci
      GEMINI_API_KEY: ci
      GROQ_API_KEY: ci
      GEMINI_BILLING_TIER: free
      ENGINE_CACHE_SECRET: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cited/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx vitest run

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
